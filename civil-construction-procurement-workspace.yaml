                    user:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Stable user identifier.
                        email:
                          type: string
                          format: email
                          description: Account-linking key across providers.
                        providers:
                          type: object
                          description: Linked sign-in providers for this user.
                        lastSignInAt:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
