managedSurface:
  - asset: Users
    category: AUTH_SERVICE
    target: gater
    basePath: /auth/6a8fe71448d0ed24dea19acd/main
    baseUrl: https://api.codata.io/auth/6a8fe71448d0ed24dea19acd/main
    issuesScheme: authBearer
    endpoints:
      - method: POST
        path: /signout
        audience: end-user
        requiresAuth: true
        operationId: signOut
        summary: Revoke the current refresh token
        group: Session
        responses:
          '204':
            description: Signed out. No response body.
          '401':
            description: Missing or invalid refresh token
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                  required:
                    - error
        security:
          - authBearer: []
      - method: POST
        path: /refresh
        audience: end-user
        requiresAuth: false
        operationId: refreshToken
        summary: Exchange a refresh token for a new access token
        group: Session
        requestBody:
          required: true
          description: Refresh token previously issued by /signin or /signup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  refreshToken:
                    type: string
                required:
                  - refreshToken
        responses:
          '200':
            description: Token refresh succeeded
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    accessToken:
                      type: string
                      description: Short-lived JWT bearer token.
                    refreshToken:
                      type: string
                      description: Long-lived token used to mint new access tokens.
                    expiresIn:
                      type: integer
                      description: Access token lifetime in seconds.
                    tokenType:
                      type: string
                      enum:
                        - Bearer
                    user:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Stable user identifier.
                        email:
                          type: string
                          format: email
                          description: Account-linking key across providers.
                        providers:
                          type: object
                          description: Linked sign-in providers for this user.
                        lastSignInAt:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - providers
                        - createdAt
                  required:
                    - accessToken
                    - refreshToken
                    - expiresIn
                    - tokenType
          '401':
            description: Refresh token expired, revoked, or unknown
            content:
              application/json:
                schema:
                  type: object
