          - authBearer: []
security:
  schemes:
    workspaceApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Per-workspace API key minted via workspaces-createApiKey.
    authBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: End-user JWT minted by the managed auth service.
resources:
  - type: AUTH
  - type: DATABASE
operations: []
