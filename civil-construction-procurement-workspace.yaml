      - method: PATCH
        path: /admin/users/:uid
        audience: admin
        requiresAuth: true
        operationId: adminUpdateUser
        summary: Update an end-user
        group: Admin
        parameters:
          - name: uid
            in: path
            required: true
            schema:
              type: string
              format: uuid
            description: Unique identifier of the end-user.
        requestBody:
          required: true
          description: Partial user patch. Send only the fields you want to change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                    description: Change the user’s email immediately (no confirmation flow).
                  password:
                    type: string
                    minLength: 8
                    description: Force-set a new password. Admin-only; bypasses current-password check.
                  email_confirm:
                    type: boolean
                    description: Mark the user’s email as verified without sending an email. Use cautiously.
                  ban_duration:
                    type: string
                    description: 'Go duration string. Examples: `"24h"` (24-hour ban), `"none"` (unban), `"876000h"` (~100 years → effectively force-logout + lock).'
                  user_metadata:
                    type: object
                    description: Free-form metadata the user can write. Merged into existing; pass `null` on a key to delete that key.
                  app_metadata:
                    type: object
                    description: 'Privileged metadata only admins can write. Common pattern: `{ "role": "owner" }`. Surfaces in the JWT under `app_metadata` for authorization checks.'
                  role:
                    type: string
                    description: GoTrue role claim baked into issued JWTs (default `"authenticated"`). Rarely changed; not the same as application role — prefer `app_metadata.role`
        responses:
          '200':
            description: Updated user record
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Stable user identifier.
                    email:
                      type: string
                      format: email
