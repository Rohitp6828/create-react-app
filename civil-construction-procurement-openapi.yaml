components:
  schemas:
    PaginationMeta:
      type: object
      description: Pagination metadata returned with list endpoints (contract codata-v1).
      properties:
        page:
          type: integer
          description: 1-based page number
        limit:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total matching records
        pages:
          type: integer
          description: Total page count
    ErrorResponse:
      type: object
      description: Error body returned on 4xx/5xx by the Gater/NiFi runtime.
      properties:
        error:
          type: string
          description: Human-readable error description
        message:
          type: string
          description: Detailed error message
    Users:
      type: object
      description: Managed platform accounts (email/password sign-in).
      properties:
        id:
          type: string
          format: uuid
          description: User id.
        providers:
          description: Linked sign-in providers for this user.
        lastSignInAt:
          type: string
          format: date-time
          example: '2026-05-05T09:30:00.000Z'
          description: Last successful sign-in across any provider.
        createdAt:
          type: string
          format: date-time
          example: '2026-05-05T09:30:00.000Z'
          description: Account creation timestamp.
          readOnly: true
        email:
          type: string
          description: account-linking key across providers.
        lastPasswordResetAt:
          type: string
