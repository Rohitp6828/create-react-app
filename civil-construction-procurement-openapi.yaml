                - contactPerson
                - email
                - category
                - status
      responses:
        '201':
          description: Vendor created.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
