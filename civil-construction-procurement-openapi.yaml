        description: 'AUTH_SERVICE (asset: Users)'
    post:
      operationId: changePassword
      summary: Change the current user’s password
      description: Requires the current password as proof-of-possession. All other sessions are invalidated on success.
      tags:
        - 'Managed: AUTH_SERVICE'
      requestBody:
        required: true
