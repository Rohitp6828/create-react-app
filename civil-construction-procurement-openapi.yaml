      - url: https://api.codata.io/auth/6a8fe71448d0ed24dea19acd/main
        description: 'AUTH_SERVICE (asset: Users)'
    post:
      operationId: completePasswordReset
      summary: Complete a password reset
      description: Sets the new password using the access token obtained by clicking the recovery link. The Authorization bearer header is required; the call revokes all other sessions on success.
      tags:
        - 'Managed: AUTH_SERVICE'
      requestBody:
        required: true
