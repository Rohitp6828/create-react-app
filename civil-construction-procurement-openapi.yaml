  /signin:
    servers:
      - url: https://api.codata.io/auth/6a8fe71448d0ed24dea19acd/main
        description: 'AUTH_SERVICE (asset: Users)'
    post:
      operationId: signInWithEmail
      summary: Authenticate with email + password
      description: Returns a fresh access / refresh token pair on success. The current session is recorded on the user’s sessions list.
      tags:
        - 'Managed: AUTH_SERVICE'
      requestBody:
        required: true
        description: User credentials.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Sign-in succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: Short-lived JWT bearer token.
                  refreshToken:
                    type: string
                    description: Long-lived token used to mint new access tokens.
                  expiresIn:
                    type: integer
                    description: Access token lifetime in seconds.
                  tokenType:
                    type: string
                    enum:
                      - Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Stable user identifier.
                      email:
                        type: string
                        format: email
                        description: Account-linking key across providers.
                      providers:
                        type: object
                        description: Linked sign-in providers for this user.
                      lastSignInAt:
                        type: string
                        format: date-time
                      createdAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - providers
                      - createdAt
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - tokenType
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          description: Account is locked or unverified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
      security: []
  /password-change:
    servers:
