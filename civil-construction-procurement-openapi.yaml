  /recover:
    servers:
      - url: https://api.codata.io/auth/6a8fe71448d0ed24dea19acd/main
        description: 'AUTH_SERVICE (asset: Users)'
    post:
      operationId: recoverPassword
      summary: Initiate password reset
      description: Dispatches a reset email with a single-use recovery link. The link redirects the browser back to the configured site URL with an access token in the URL fragment; the client then calls `/reset-password` to set the new password.
      tags:
        - 'Managed: AUTH_SERVICE'
      requestBody:
        required: true
        description: Address to send the reset email to.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        '202':
          description: Reset email dispatched (always returns Accepted to avoid leaking account existence).
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: Recovery rate limit hit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
      security: []
  /reset-password:
