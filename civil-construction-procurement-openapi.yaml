openapi: 3.0.0
info:
  title: Civil Construction Procurement API
  description: |-
    A back-end purchase module for civil construction procurement that manages vendors, purchase requisitions, purchase orders, goods receipts, and invoice approvals through a structured ops workflow. Anyone can browse the public catalog; only the workspace owner can access /manage to create and edit procurement records.

    Request bodies are capped at 256 KiB (262144 bytes). Write requests (POST/PUT/PATCH) with a larger body are rejected with HTTP 413 (Payload Too Large) before they reach the backend.
  version: 1.0.0
servers:
  - url: https://api.codata.io/v0/workspace/6a8fe71448d0ed24dea19acd/branch/main/api
    description: 'API Server (branch: main)'
paths:
  /vendors:
    get:
      operationId: listVendors
      summary: List vendors
      description: Returns a paginated list of vendors.
      tags: []
      parameters:
        - name: pageOffset
          in: query
          required: false
          description: Number of records to skip (0-based).
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageLimit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 100
        - name: id
          in: query
          required: false
          description: Filter by id (exact match)
          schema:
            type: string
        - name: id_in
          in: query
          required: false
          description: Filter by one or more id values (repeat the parameter)
        - name: name
          in: query
          required: false
          description: Filter by name (exact match)
          schema:
            type: string
        - name: contactPerson
          in: query
          required: false
          description: Filter by contactPerson (exact match)
          schema:
            type: string
        - name: email
          in: query
          required: false
          description: Filter by email (exact match)
          schema:
            type: string
        - name: phone
          in: query
          required: false
          description: Filter by phone (exact match)
          schema:
            type: string
        - name: address
          in: query
          required: false
          description: Filter by address (exact match)
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter by category (exact match)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by status (exact match)
          schema:
            type: string
        - name: taxId
          in: query
          required: false
          description: Filter by taxId (exact match)
          schema:
            type: string
        - name: paymentTerms
          in: query
          required: false
          description: Filter by paymentTerms (exact match)
          schema:
            type: string
        - name: rating
          in: query
          required: false
          description: Filter by rating (exact match)
          schema:
            type: number
        - name: rating_gte
          in: query
          required: false
          description: Filter rating greater than or equal to the given value
          schema:
            type: number
        - name: rating_lte
          in: query
          required: false
          description: Filter rating less than or equal to the given value
          schema:
            type: number
      requestBody: {}
      responses:
        '200':
          description: Paginated list of vendors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Page of vendors.
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      pageOffset:
                        type: integer
                        minimum: 0
                      pageLimit:
                        type: integer
                        minimum: 0
                    required:
                      - pageOffset
                      - pageLimit
                required:
                  - data
                  - pagination
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: createVendor
      summary: Create Vendor
      description: Creates a new Vendor.
      tags: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                contactPerson:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  nullable: true
                address:
                  type: string
                  nullable: true
                category:
                  type: string
                  enum:
                    - Materials
                    - Equipment
                    - Subcontractor
                    - Services
                status:
                  type: string
                  enum:
                    - Active
                    - Inactive
                    - Blacklisted
                taxId:
                  type: string
                  nullable: true
                paymentTerms:
                  type: string
                  enum:
                    - Net 15
                    - Net 30
                    - Net 60
                    - Immediate
                  nullable: true
                rating:
                  type: number
                  nullable: true
              required:
