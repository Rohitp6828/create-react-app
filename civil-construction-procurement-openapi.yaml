      responses:
        '204':
          description: Password reset. Other sessions revoked.
        '401':
          description: Missing or expired recovery token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
