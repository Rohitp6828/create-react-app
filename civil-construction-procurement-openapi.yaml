  /signout:
    servers:
      - url: https://api.codata.io/auth/6a8fe71448d0ed24dea19acd/main
        description: 'AUTH_SERVICE (asset: Users)'
    post:
      operationId: signOut
      summary: Revoke the current refresh token
      description: Invalidates the refresh token used by the calling session. The companion access token remains valid until it expires naturally. Call this on user-initiated sign-out.
      tags:
        - 'Managed: AUTH_SERVICE'
      responses:
        '204':
          description: Signed out. No response body.
        '401':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      security:
        - authBearer: []
  /refresh:
    servers:
      - url: https://api.codata.io/auth/6a8fe71448d0ed24dea19acd/main
        description: 'AUTH_SERVICE (asset: Users)'
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      description: Rotates the refresh token and returns a fresh short-lived access token. Use this when an access token has expired or is about to expire.
      tags:
        - 'Managed: AUTH_SERVICE'
      requestBody:
        required: true
        description: Refresh token previously issued by /signin or /signup.
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Token refresh succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: Short-lived JWT bearer token.
                  refreshToken:
                    type: string
                    description: Long-lived token used to mint new access tokens.
                  expiresIn:
                    type: integer
                    description: Access token lifetime in seconds.
                  tokenType:
                    type: string
                    enum:
                      - Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Stable user identifier.
                      email:
                        type: string
                        format: email
                        description: Account-linking key across providers.
                      providers:
                        type: object
                        description: Linked sign-in providers for this user.
                      lastSignInAt:
                        type: string
                        format: date-time
                      createdAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - providers
                      - createdAt
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - tokenType
        '401':
          description: Refresh token expired, revoked, or unknown
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      security: []
